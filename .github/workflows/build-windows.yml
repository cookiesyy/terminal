name: Build Windows Terminal

on:
  push:
    branches: [ feature/sidebar-file-browser ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: |
        nuget restore Scratch.sln
        nuget restore src/types/lib/types.vcxproj -PackagesDirectory packages
        nuget restore scratch/ScratchIslandApp/SampleApp/SampleAppLib.vcxproj -PackagesDirectory packages

    - name: Build solution
      run: |
        msbuild Scratch.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /m

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTerminal-x64-Release
        path: |
          src/cascadia/CascadiaPackage/bin/x64/Release/
          !**/*.pdb
