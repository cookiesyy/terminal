name: Build Windows Terminal

on:
  push:
    branches: [ feature/sidebar-file-browser ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: |
        nuget restore dep/nuget/packages.config -PackagesDirectory packages
        nuget restore build/packages.config -PackagesDirectory packages
        nuget restore Scratch.sln

    - name: Build solution
      run: |
        msbuild src/types/lib/types.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:PlatformToolset=v143 /p:SolutionDir=$PWD\ /m

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTerminal-x64-Release
        path: |
          src/cascadia/CascadiaPackage/bin/x64/Release/
          !**/*.pdb
