name: Build Windows Terminal

on:
  push:
    branches: [ feature/sidebar-file-browser ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: |
        nuget restore OpenConsole.slnx
        nuget restore dep/nuget/packages.config -PackagesDirectory packages
        nuget restore build/packages.config -PackagesDirectory packages

    - name: Build solution
      run: |
        msbuild OpenConsole.slnx /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTerminal-x64-Release
        path: |
          bin/x64/Release/*.exe
          bin/x64/Release/*.dll
          src/cascadia/CascadiaPackage/AppPackages/**/*.msix
          src/cascadia/CascadiaPackage/AppPackages/**/*.msixbundle
