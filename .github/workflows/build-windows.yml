name: Build Windows Terminal

on:
  push:
    branches: [ feature/sidebar-file-browser ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Scratch.sln

    - name: Retarget solution to available SDK
      run: |
        $sdkVersion = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).Name
        Write-Host "Using Windows SDK version: $sdkVersion"
        msbuild Scratch.sln /t:RestorePackages /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdkVersion

    - name: Build solution
      run: |
        $sdkVersion = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).Name
        msbuild Scratch.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdkVersion /m

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowsTerminal-x64-Release
        path: |
          src/cascadia/CascadiaPackage/bin/x64/Release/
          !**/*.pdb
